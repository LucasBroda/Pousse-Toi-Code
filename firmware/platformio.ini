; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Version figée pour que toute l'équipe compile pareil (P-05) :
; espressif32 8.0.0 embarque le cœur Arduino pour ESP32 3.3.12,
; la même version que le paquet esp32 d'Arduino IDE.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Envoie une ligne entière au firmware quand on tape Entrée (commandes série)
monitor_echo = yes
monitor_eol = LF
lib_deps =
    adafruit/Adafruit BME280 Library@2.2.4
    claws/BH1750@1.3.0
    adafruit/RTClib@2.1.4
    bblanchon/ArduinoJson@7.2.1